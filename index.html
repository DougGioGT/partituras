<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover" />

<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<title>AtrilSync Pro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{color-scheme:dark light;--bg:#000;--stage:#0b0b0d;--card:#1c1c1e;--card2:#2c2c2e;--fill:rgba(120,120,128,.24);--text:#f5f5f7;--text2:#98989f;--line:rgba(255,255,255,.09);--accent:#e5b869;--on-accent:#1a1204;--green:#30d158;--red:#ff453a;--blue:#64a8ff;--glass:rgba(28,28,30,.74)}
@media(prefers-color-scheme:light){:root{--bg:#f2f2f7;--stage:#d9d9de;--card:#fff;--card2:#f2f2f7;--fill:rgba(120,120,128,.14);--text:#1d1d1f;--text2:#6e6e73;--line:rgba(0,0,0,.1);--accent:#b7791f;--on-accent:#fff;--green:#1f9d46;--red:#d92d20;--blue:#0a64d6;--glass:rgba(255,255,255,.78)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;user-select:none;-webkit-user-select:none;display:flex;flex-direction:column;height:100dvh}
input,textarea,select{user-select:text;-webkit-user-select:text;font:inherit;color:inherit}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
h2,h3,p{margin:0}
.hidden{display:none!important}
.glass{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px)}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
/* components */
.btn{min-height:44px;padding:0 16px;border-radius:12px;background:var(--fill);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s,opacity .2s;text-align:center}
.btn:active{transform:scale(.97);opacity:.8}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--red)}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.icon{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--fill);flex:none}
.icon.sm{width:34px;height:34px;font-size:16px}
.chip{height:36px;padding:0 12px;border-radius:999px;background:var(--fill);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.chip.on{background:var(--accent);color:var(--on-accent)}
.input{width:100%;min-height:44px;padding:0 12px;border-radius:12px;border:0;background:var(--fill);outline:0;font-size:16px}
textarea.input{padding:10px 12px;min-height:96px;font-size:14px}
.input:focus{box-shadow:0 0 0 2px var(--accent)}
label.field{display:block;font-size:13px;color:var(--text2);margin:0 0 6px 4px}
.group{background:var(--card2);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:50px;padding:8px 16px;width:100%;text-align:left;border-top:1px solid var(--line)}
.group>.row:first-child{border-top:0}
button.row:active{background:var(--fill)}
.row .val{color:var(--text2);font-size:14px}
.row .chev{color:var(--text2);font-size:20px}
.row.sel{background:rgba(229,184,105,.16)}
.stack{display:flex;flex-direction:column;gap:12px}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.flex>.grow{flex:1;min-width:0}
.muted{color:var(--text2);font-size:13px}
.foot{color:var(--text2);font-size:12px;text-align:center}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);margin:6px 4px -4px}
.switch{position:relative;width:51px;height:31px;flex:none}
.switch input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;border-radius:999px;background:var(--fill);transition:.2s}
.switch i:after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:.2s}
.switch input:checked+i{background:var(--green)}
.switch input:checked+i:after{transform:translateX(20px)}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px}
.seg button{flex:1;height:34px;border-radius:8px;font-weight:600;font-size:14px;color:var(--text2)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.note{padding:10px 12px;border-radius:12px;background:var(--fill);font-size:13px;color:var(--text2)}
.note.ok{background:rgba(48,209,88,.15);color:var(--green)}
.note.err{background:rgba(255,69,58,.15);color:var(--red)}
.bar{height:6px;border-radius:9px;background:var(--fill);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0;scrollbar-width:none;flex:none}
.chips::-webkit-scrollbar{display:none}
.tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--fill);color:var(--text2);white-space:nowrap}
.tag.green{background:rgba(48,209,88,.16);color:var(--green)}
.tag.blue{background:rgba(100,168,255,.16);color:var(--blue)}
.tag.gold{background:rgba(229,184,105,.2);color:var(--accent)}
.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-main{min-width:0;flex:1}
/* sheets */
#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}
#backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;width:100%;max-width:600px;max-height:calc(100dvh - env(safe-area-inset-top) - 10px);display:flex;flex-direction:column;background:var(--card);border-radius:22px 22px 0 0;transform:translateY(105%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s;box-shadow:0 -10px 40px rgba(0,0,0,.35)}
.sheet.open{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.sh{display:flex;align-items:center;justify-content:space-between;padding:14px calc(18px + env(safe-area-inset-right)) 8px calc(18px + env(safe-area-inset-left));flex:none}
.sh h2{font-size:20px;font-weight:700}
.link{color:var(--accent);font-weight:600;font-size:16px;padding:6px 4px}
.sb{flex:1 1 auto;min-height:0;padding:8px calc(16px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain;display:flex;flex-direction:column;gap:14px}
.sb>*{flex-shrink:0}
@media(max-height:520px){
  .sheet{max-width:min(96vw,680px);max-height:calc(100dvh - 8px);border-radius:16px 16px 0 0}
  .sh{padding:10px calc(16px + env(safe-area-inset-right)) 6px calc(16px + env(safe-area-inset-left))}
  .sh h2{font-size:17px}
  .sb{gap:10px;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  #topbar{padding:4px 12px}
  #dock{padding:4px 10px 6px}
  .dock-in button{min-width:42px;height:40px;font-size:19px}
}
/* app */
#topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;border-bottom:1px solid var(--line);z-index:20;animation:fade .25s;flex:none}
#btnRepertoire{display:flex;flex-direction:column;align-items:flex-start;min-width:0;text-align:left;flex:1;padding:2px 4px}
#curTitle{font-size:17px;font-weight:700;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#curSub{font-size:12px;color:var(--text2)}
.dot{width:8px;height:8px;border-radius:50%;background:#8e8e93;flex:none}
.dot.on{background:var(--green)}
#remoteBar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 14px;background:rgba(229,184,105,.14);font-size:13px;flex:none}
#workspace{flex:1;min-height:0;display:flex;position:relative;overflow:hidden}
#masterPane{width:100%;display:flex;flex-direction:column;min-height:0;background:var(--bg);border-right:1px solid var(--line)}
#masterPaneHead{padding:10px 12px 8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line);flex:none}
#masterSetlistContainer{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:8px 10px}
#masterPaneFoot{padding:8px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;flex:none;background:var(--card)}
#stage{flex:1;min-height:0;min-width:0;position:relative;background:var(--stage)}
@media(min-width:720px){
  #masterPane{width:350px;flex:none}
  #btnMasterToggleScore{display:none!important}
}
@media(max-width:719px){
  body.master-list #stage{display:none}
  body.master-score #masterPane{display:none}
}
body.zen #masterPane{display:none!important}
#surface{position:absolute;inset:0;overflow:auto;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch}
#zoomWrap{min-width:100%;width:max-content;display:flex;justify-content:center;padding:8px;transform-origin:top center}
#pdfRenderCanvas{border-radius:6px;box-shadow:0 12px 40px rgba(0,0,0,.45);flex:none;background:#fff}
#pdfRenderCanvas.night{filter:invert(.92) hue-rotate(180deg)}
#emptyState{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
#emptyState .big{font-size:44px;opacity:.9}
#emptyState h3{font-size:22px;font-weight:700}
#emptyState p{color:var(--text2);max-width:320px}
#stageCueBanner{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:5;background:var(--red);color:#fff;padding:10px 22px;border-radius:999px;font-weight:800;font-size:20px;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:fade .25s;max-width:90%;text-align:center}
#zenExit{position:absolute;top:calc(env(safe-area-inset-top) + 10px);right:10px;z-index:6;opacity:.55}
#zenBadge{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 8px);left:50%;transform:translateX(-50%);z-index:6;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;color:var(--text2);background:var(--glass)}
body.zen #topbar,body.zen #dock,body.zen #remoteBar{display:none}
body:not(.zen) #zenExit,body:not(.zen) #zenBadge{display:none}
#dock{display:flex;justify-content:center;padding:8px 12px calc(env(safe-area-inset-bottom) + 10px);flex:none;animation:fade .25s}
.dock-in{display:flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:999px;padding:5px}
.dock-in button{min-width:48px;height:48px;border-radius:999px;font-size:22px;display:grid;place-items:center;transition:transform .12s,background .2s}
.dock-in button:active{transform:scale(.92);background:var(--fill)}
.dock-in .main{background:var(--accent);color:var(--on-accent)}
.dock-in .small{font-size:15px;font-weight:600;padding:0 14px}
#pageLbl{min-width:72px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
#hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%);z-index:30;padding:10px 16px;border-radius:16px;font-size:13px;text-align:center;max-width:90%;border:1px solid var(--line);animation:fade .3s}
#connToast{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translate(-50%,-180%);z-index:130;width:min(92%,420px);display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:18px;border:1px solid var(--line);transition:transform .35s cubic-bezier(.2,.8,.2,1);box-shadow:0 10px 30px rgba(0,0,0,.35)}
#connToast.show{transform:translate(-50%,0)}
#connToastIcon{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff;flex:none}
#connToast.success #connToastIcon{background:var(--green)}
#connToast.error #connToastIcon{background:var(--red)}
#connToastTitle{font-weight:700;font-size:14px}
#connToastDetail{font-size:12px;color:var(--text2)}
#welcome{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 20px) 20px calc(24px + env(safe-area-inset-bottom))}
#welcome .in{margin:auto 0;width:100%;max-width:460px;display:flex;flex-direction:column;gap:12px}
.wcard{display:flex;gap:14px;align-items:center;text-align:left;padding:18px;border-radius:20px;background:var(--card);width:100%;transition:transform .12s}
.wcard:active{transform:scale(.98)}
.wcard .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:rgba(229,184,105,.18);flex:none}
.wcard b{display:block;font-size:17px}
.wcard span.d{color:var(--text2);font-size:13px}
.qrbox canvas{display:block;margin:0 auto;border-radius:12px;background:#fff;width:min(100%,280px);height:auto;image-rendering:pixelated;cursor:zoom-in}
video#qrVideo{width:100%;max-height:240px;border-radius:12px;background:#000;object-fit:cover}
.room{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.room:first-child{border-top:0}
details.group summary{padding:14px 16px;cursor:pointer;color:var(--text2);font-size:14px}
details.group>div{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px}
</style>
</head>
<body>

<!-- Aviso de conexión -->
<div id="connToast" class="glass" role="status" aria-live="polite">

</div>

<!-- Barra superior -->

</header>

<div id="remoteBar" class="hidden">

  <button id="btnRemoteDownloadPdf" class="btn sm primary">Guardar offline</button>
</div>

<!-- Espacio principal (Maestro: lista + visor | Atril: visor) -->
<div id="workspace">
