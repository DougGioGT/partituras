<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AtrilSync Pro" />
  <meta name="theme-color" content="#0b0f19" />
  <title>AtrilSync Pro — Control Maestro de Partituras PDF</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0b0f19;
      color: #f1f5f9;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .score-paper {
      background: #fdfbf7;
      color: #111827;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.65);
    }
    .score-inverted {
      filter: invert(0.92) hue-rotate(180deg);
    }
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: #111827;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;
    }
    #qrDisplayBox img, #qrDisplayBox canvas {
      margin: 0 auto;
      border-radius: 8px;
      border: 8px solid #ffffff;
      background: #ffffff;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- TOP NAVIGATION BAR -->
  <header id="topHeader" class="bg-slate-900/95 border-b border-slate-800 px-3 py-2.5 sticky top-0 z-30 backdrop-blur transition-all">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-400 font-extrabold text-sm">
          ♫
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-bold text-sm sm:text-base tracking-tight text-white">AtrilSync Pro</h1>
            <span id="connBadge" class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-slate-800 text-slate-300 border border-slate-700">
              Modo Local
            </span>
            <span id="offlineBadge" class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 hidden">
              ✓ Caché Offline
            </span>
          </div>
          <p id="saveIndicator" class="text-[11px] text-emerald-400/90 hidden sm:block">✓ Cambios guardados automáticamente</p>
        </div>
      </div>

      <!-- Role Mode Switcher -->
      <div class="flex items-center gap-1 bg-slate-950 p-1 rounded-xl border border-slate-800">
        <button id="btnModeMaster" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold transition text-slate-300 hover:text-white">
          👑 Maestro
        </button>
        <button id="btnModeMusician" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold transition text-slate-300 hover:text-white">
          🎺 Músico
        </button>
        <button id="btnModeSplit" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold transition bg-amber-500 text-slate-950">
          ⚡ Mixta
        </button>
      </div>

      <!-- Instrument Selector + Actions -->
      <div class="flex items-center gap-1.5 flex-wrap">
        <div id="instrumentControlBox" class="flex items-center gap-1.5 bg-slate-800/80 border border-slate-700 rounded-xl px-2.5 py-1">
          <span class="text-[11px] text-slate-400">Atril:</span>
          <select id="selectMyInstrument" class="bg-transparent text-xs font-semibold text-amber-300 focus:outline-none cursor-pointer">
            <option value="Trompeta 1">Trompeta 1</option>
            <option value="Trompeta 2">Trompeta 2</option>
            <option value="Trompeta 3">Trompeta 3</option>
            <option value="Saxo Alto">Saxo Alto</option>
            <option value="Saxo Tenor">Saxo Tenor</option>
            <option value="Piano">Piano</option>
            <option value="Bajo">Bajo</option>
            <option value="Guitarra">Guitarra</option>
            <option value="Percusión">Percusión</option>
          </select>
        </div>

        <button id="btnOpenFolderModal" class="px-2.5 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold transition flex items-center gap-1">
          <span>📂</span> <span class="hidden md:inline">Cargar PDFs</span>
        </button>

        <button id="btnOpenConnModal" class="px-2.5 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold transition flex items-center gap-1">
          <span>📡</span> <span class="hidden md:inline">Conectar</span>
        </button>

        <button id="btnToggleZenMode" title="Ocultar barras y leer a pantalla completa" class="px-2.5 py-1.5 rounded-xl bg-amber-500/20 hover:bg-amber-500/30 border border-amber-500/40 text-amber-300 text-xs font-bold transition flex items-center gap-1">
          <span>⛶</span> <span class="hidden sm:inline">Pantalla Completa</span>
        </button>
      </div>
    </div>
  </header>

  <!--
